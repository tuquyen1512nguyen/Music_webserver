<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Khám phá • TheAura Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Đảm bảo đã có explore-... selector trong style.css! -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{header}"></div>
<div class="explore-section">
    <br> <br> <br>
    <h2><i class="fa fa-fire"></i> Xu hướng tuần này</h2>
    <div class="explore-grid">
        <div class="explore-card">
            <img src="https://i.imgur.com/2DhmtJ4.jpg" alt="Faded">
            <div class="explore-card-title">Faded</div>
            <div class="explore-card-sub">Alan Walker</div>
            <button class="explore-quick-play-btn" title="Nghe bài hát"><i class="fa fa-play"></i></button>
        </div>
        <div class="explore-card">
            <img src="https://i.imgur.com/CUe7RkV.jpg" alt="Shape of You">
            <div class="explore-card-title">Shape of You</div>
            <div class="explore-card-sub">Ed Sheeran</div>
            <button class="explore-quick-play-btn" title="Nghe bài hát"><i class="fa fa-play"></i></button>
        </div>
        <div class="explore-card">
            <img src="https://i.imgur.com/3ZQ3ZQh.jpg" alt="On My Way">
            <div class="explore-card-title">On My Way</div>
            <div class="explore-card-sub">Alan Walker, Sabrina Carpenter</div>
            <button class="explore-quick-play-btn" title="Nghe bài hát"><i class="fa fa-play"></i></button>
        </div>
    </div>
</div>

<div class="explore-section">
    <h2><i class="fa fa-music"></i> Playlist tuyển chọn</h2>
    <div class="explore-grid">
        <div class="explore-card">
            <img src="https://i.imgur.com/CUe7RkV.jpg" alt="Chill Vibes">
            <div class="explore-card-title">Chill Vibes</div>
            <div class="explore-card-sub">Thư giãn • 24 bài hát</div>
            <button class="explore-quick-play-btn" title="Nghe playlist"><i class="fa fa-play"></i></button>
        </div>
        <div class="explore-card">
            <img src="https://i.imgur.com/2DhmtJ4.jpg" alt="EDM Hits">
            <div class="explore-card-title">EDM Hits</div>
            <div class="explore-card-sub">Sôi động • 22 bài hát</div>
            <button class="explore-quick-play-btn" title="Nghe playlist"><i class="fa fa-play"></i></button>
        </div>
    </div>
</div>

<div class="explore-section">
    <h2><i class="fa fa-compact-disc"></i> Album hot</h2>
    <div class="explore-grid">
        <div class="explore-card">
            <img src="https://i.imgur.com/Z9qQZ8k.jpeg" alt="Divide">
            <div class="explore-card-title">Divide</div>
            <div class="explore-card-sub">Ed Sheeran</div>
            <button class="explore-quick-play-btn" title="Nghe album"><i class="fa fa-play"></i></button>
        </div>
        <div class="explore-card">
            <img src="https://i.imgur.com/XcT7bhu.jpeg" alt="Uncover">
            <div class="explore-card-title">Uncover</div>
            <div class="explore-card-sub">Alan Walker</div>
            <button class="explore-quick-play-btn" title="Nghe album"><i class="fa fa-play"></i></button>
        </div>
    </div>
</div>

<div class="explore-section">
    <h2><i class="fa fa-star"></i> Nghệ sĩ nổi bật</h2>
    <div class="explore-grid">
        <div class="explore-card">
            <img src="https://i.imgur.com/kQKQ1AN.jpeg" alt="Alan Walker">
            <div class="explore-card-title">Alan Walker</div>
            <button class="explore-quick-play-btn" title="Xem nghệ sĩ"><i class="fa fa-arrow-right"></i></button>
        </div>
        <div class="explore-card">
            <img src="https://i.imgur.com/MTd8NHo.jpeg" alt="Taylor Swift">
            <div class="explore-card-title">Taylor Swift</div>
            <button class="explore-quick-play-btn" title="Xem nghệ sĩ"><i class="fa fa-arrow-right"></i></button>
        </div>
    </div>
</div>

</body>
</html>
