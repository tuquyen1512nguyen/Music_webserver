<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${playlist.name} + ' - TheAura Music'">Danh sách phát</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<th:block th:replace="~{layout/header-private :: header}"></th:block>

<div class="container py-5" style="margin-top:120px; max-width:1400px;">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold" style="background: linear-gradient(90deg, #8a2be2, #4169e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" th:text="${playlist.name}">Tên playlist</h1>
        <p class="text-muted" th:text="${playlist.description}">Mô tả</p>
        <p class="fs-5" th:text="${#lists.size(playlist.songs) + ' bài hát'}">0 bài hát</p>
    </div>

    <!-- Danh sách bài hát -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${playlist.songs != null && !playlist.songs.isEmpty()}">
        <div th:each="ps : ${playlist.songs}" class="col">
            <div class="card h-100 shadow-sm border-0" style="background:rgba(30,30,70,0.8); border-radius:20px; overflow:hidden; cursor:pointer;">
                <img th:src="${ps.song.thumbnail}" class="card-img-top" alt="thumbnail" style="height:220px; object-fit:cover;">
                <div class="card-body text-center">
                    <h5 class="card-title text-white mb-2" th:text="${ps.song.title}">Tên bài hát</h5>
                    <p class="card-text text-muted" th:text="${ps.song.artist}">Ca sĩ</p>
                    <!-- Bấm vào card → nhảy về nghe bài hát -->
                    <a th:href="@{'/songs/' + ${ps.song.id}}" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;"></a>
                    <button class="btn btn-primary rounded-pill px-4" style="position:relative; z-index:2;">
                        <i class="fa fa-play me-2"></i> Nghe ngay
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Nếu playlist trống -->
    <div class="text-center py-5" th:if="${playlist.songs == null or playlist.songs.isEmpty()}">
        <p class="fs-4 text-muted">Playlist này chưa có bài hát nào.</p>
        <a href="/" class="btn btn-outline-primary">Tìm nhạc để thêm</a>
    </div>
</div>

<div class="wave"></div>
</body>
</html>
