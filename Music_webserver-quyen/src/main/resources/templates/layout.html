<!-- src/main/resources/templates/layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'TheAura Music'">TheAura Music</title>

    <!-- CSS CHUNG -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- DÙNG HEADER ĐÚNG THEO TRẠNG THÁI ĐĂNG NHẬP -->
<th:block th:replace="${
        #authentication != null and #authentication.authenticated
        ? ~{layout/header-private :: header}
        : ~{layout/header-public :: header}
    }"></th:block>

<!-- Nội dung trang con -->
<main class="container py-5" style="margin-top: 100px;">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Hiệu ứng sóng tím -->
<div class="wave"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
