<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bài hát • TheAura Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{header}"></div>

<div class="admin-dashboard-container">
    <h2 class="admin-section-title"><i class="fa fa-music"></i> Quản lý bài hát</h2>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Thumbnail</th>
                <th>Tiêu đề</th>
                <th>Ca sĩ</th>
                <th>Lượt nghe</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="song : ${songs}">
                <td th:text="${song.id}">1</td>
                <td><img th:src="${song.thumbnail}" class="table-thumb" alt="thumb"></td>
                <td th:text="${song.title}">Faded</td>
                <td th:text="${song.artist}">Alan Walker</td>
                <td th:text="${song.viewCount}">999999</td>
                <td>
                    <button class="btn-action btn-edit"><i class="fa fa-edit"></i></button>
                    <button class="btn-action btn-delete"><i class="fa fa-trash"></i></button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="wave"></div>
</body>
</html>
