<!-- src/main/resources/templates/home.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ • TheAura Music</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header chung (menu sẽ tự đổi khi đã login) -->
<th:block th:replace="~{layout/header-private :: header}"></th:block>

<!-- Banner chào mừng -->
<section class="banner">
    <h1 class="display-4 fw-bold text-center mb-4">
        Chào mừng đến với TheAura
    </h1>
    <p>Bắt đầu nghe những bài hát yêu thích của bạn!</p>
</section>

<!-- Tiếp tục nghe -->
<h3 class="section-title">Tiếp tục nghe</h3>
<div class="song-grid">
    <div class="song-card">
        <img src="https://i.imgur.com/2DhmtJ4.jpg" alt="Faded">
        <div class="song-title">Faded</div>
        <div class="song-artist">Alan Walker</div>
    </div>
    <div class="song-card">
        <img src="https://i.imgur.com/3ZQ3ZQh.jpg" alt="Somewhere Only We Know">
        <div class="song-title">Somewhere Only We Know</div>
        <div class="song-artist">Keane</div>
    </div>
    <div class="song-card">
        <img src="https://i.imgur.com/CUe7RkV.jpg" alt="Shape of You">
        <div class="song-title">Shape of You</div>
        <div class="song-artist">Ed Sheeran</div>
    </div>
</div>

</body>
</html>
