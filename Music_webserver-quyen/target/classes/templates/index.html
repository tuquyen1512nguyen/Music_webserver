<!-- src/main/resources/templates/index.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheAura Music</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- DÙNG HEADER CHUNG – MENU SẼ ĐỔI ĐÚNG KHI ĐĂNG NHẬP -->
<th:block th:replace="~{layout/header-public :: header}"></th:block>

<!-- GIỮ NGUYÊN 100% NỘI DUNG + CSS CŨ CỦA EM -->
<section class="banner">
    <h1>Khám phá âm nhạc mọi lúc</h1>
    <p>Nghe nhạc miễn phí – Không cần đăng nhập!</p>
</section>

<h3 class="section-title">
    <i class="fa fa-fire"></i>
    <span sec:authorize="isAuthenticated()"></span>
    <span sec:authorize="isAnonymous()">Bài hát nổi bật</span>
</h3>

<div class="song-grid">
    <div th:each="song : ${featuredSongs}" class="song-item">
        <div class="song-card">
            <div class="position-relative overflow-hidden rounded-3">
                <img th:src="${song.thumbnail} ?: 'https://via.placeholder.com/400x400/e9ecef/6c757d?text=No+Image'"
                     class="img-fluid w-100" style="height: 260px; object-fit: cover;">
                <div class="play-overlay">
                    <a th:href="@{'/songs/' + ${song.id}}" class="play-button">
                        ▶
                    </a>
                </div>
            </div>
            <div class="p-3 text-center">
                <h5 class="song-title mb-1" th:text="${song.title}">Tên bài hát</h5>
                <p class="song-artist mb-0" th:text="${song.artist} ?: 'Không rõ ca sĩ'">Ca sĩ</p>
            </div>
        </div>
    </div>
</div>

<div class="song-grid">
    <div class="song-card">
        <img src="https://i.imgur.com/2DhmtJ4.jpg" alt="Faded">
        <div class="song-title">Faded</div>
        <div class="song-artist">Alan Walker</div>
    </div>
    <div class="song-card">
        <img src="https://i.imgur.com/3ZQ3ZQh.jpg" alt="Somewhere Only We Know">
        <div class="song-title">Somewhere Only We Know</div>
        <div class="song-artist">Keane</div>
    </div>
    <div class="song-card">
        <img src="https://i.imgur.com/CUe7RkV.jpg" alt="Shape of You">
        <div class="song-title">Shape of You</div>
        <div class="song-artist">Ed Sheeran</div>
    </div>
    <!-- Thêm bao nhiêu card tùy thích -->
</div>

</body>
</html>
