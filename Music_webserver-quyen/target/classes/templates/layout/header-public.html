<!-- src/main/resources/templates/layout/header-public.html -->
<header xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="logo">TheAura</div>
    <div class="search-container">
        <form th:action="@{/search}" method="get" autocomplete="off">
            <input type="text" name="keyword" class="search-box" placeholder="Tìm kiếm bài hát, nghệ sĩ, album...">
            <span class="search-icon">
                <i class="fa fa-search"></i>
            </span>
        </form>
    </div>
    <nav>
        <a href="/"><i class="fa fa-home"></i> Trang chủ</a>
        <a href="/explore"><i class="fa fa-compass"></i> Khám phá</a>
        <a href="/library"><i class="fa fa-layer-group"></i> <b>Thư viện</b></a>
        <a th:href="@{/albums}"><i class="fa fa-compact-disc"></i> Album</a>
        <a th:href="@{/login}" class="auth-btn"><i class="fa fa-sign-in-alt"></i> Đăng nhập</a>
        <a th:href="@{/register}" class="auth-btn"><i class="fa fa-user-plus"></i> Đăng ký</a>
    </nav>
</header>
<!-- Font Awesome cho icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
