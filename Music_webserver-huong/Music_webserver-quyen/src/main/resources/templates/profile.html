<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ • TheAura Music</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS chính -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header chung -->
<div th:replace="~{header :: header}"></div>

<!-- Profile Container -->
<div class="profile-page-container">
    <div class="profile-card">

        <!-- Header chào mừng -->
        <div class="profile-header-section">
            <i class="fa fa-user-circle profile-avatar-icon"></i>
            <h2>Hồ sơ cá nhân</h2>
            <p class="greeting-text">
                Xin chào,
                <strong th:text="${#authentication?.principal?.username} ?: 'User'">User</strong>!
            </p>
        </div>

        <!-- Body form -->
        <div class="profile-body-section">

            <!-- Thông báo chung -->
            <div th:if="${successMessage}" class="alert-box success text-center mb-4">
                <i class="fa fa-check-circle"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert-box error text-center mb-4">
                <i class="fa fa-exclamation-triangle"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- ==================== FORM ĐỔI MẬT KHẨU ==================== -->
            <div class="profile-form-section">
                <h4 class="section-title-center">Thay đổi mật khẩu</h4>
                <form th:action="@{/profile/change-password}" method="post">

                    <div class="form-group">
                        <label for="currentPassword">Mật khẩu hiện tại</label>
                        <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required minlength="6">
                    </div>

                    <div class="button-center">
                        <button type="submit" class="btn-primary-large">
                            <i class="fa fa-save"></i> Cập nhật mật khẩu
                        </button>
                    </div>
                </form>
            </div>

            <!-- ==================== FORM CẬP NHẬT SỞ THÍCH ==================== -->
            <div class="profile-form-section mt-5">
                <h4 class="section-title-center">Cập nhật sở thích âm nhạc của bạn 🎵</h4>
                <p class="text-center text-muted mb-4">Chúng tôi sẽ gợi ý bài hát phù hợp hơn dựa trên lựa chọn của bạn!</p>

                <!-- Sở thích hiện tại -->
                <div class="current-preferences mb-5">
                    <p><strong>Thể loại yêu thích:</strong>
                        <span th:text="${currentUser?.favoriteGenres?.replace(',', ', ')} ?: 'Chưa chọn'">Chưa chọn</span>
                    </p>
                    <p><strong>Nghệ sĩ yêu thích:</strong>
                        <span th:text="${currentUser?.favoriteArtists} ?: 'Chưa chọn'">Chưa chọn</span>
                    </p>
                </div>

                <form th:action="@{/profile/update-preferences}" method="post">

                    <!-- Thể loại yêu thích -->
                    <div class="form-group">
                        <label class="form-label">Thể loại yêu thích <span class="text-muted">(chọn nhiều)</span></label>
                        <div class="checkbox-grid">
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="Pop"
                                       th:checked="${currentUser?.favoriteGenres?.contains('Pop')}">
                                <span>Pop</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="Rock"
                                       th:checked="${currentUser?.favoriteGenres?.contains('Rock')}">
                                <span>Rock</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="EDM"
                                       th:checked="${currentUser?.favoriteGenres?.contains('EDM')}">
                                <span>EDM</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="Ballad"
                                       th:checked="${currentUser?.favoriteGenres?.contains('Ballad')}">
                                <span>Ballad</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="Rap/Hip-hop"
                                       th:checked="${currentUser?.favoriteGenres?.contains('Rap/Hip-hop')}">
                                <span>Rap/Hip-hop</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="V-Pop"
                                       th:checked="${currentUser?.favoriteGenres?.contains('V-Pop')}">
                                <span>V-Pop</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="Indie"
                                       th:checked="${currentUser?.favoriteGenres?.contains('Indie')}">
                                <span>Indie</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="favoriteGenres" value="K-Pop"
                                       th:checked="${currentUser?.favoriteGenres?.contains('K-Pop')}">
                                <span>K-Pop</span>
                            </label>
                        </div>
                    </div>

                    <!-- Nghệ sĩ yêu thích -->
                    <div class="form-group">
                        <label class="form-label">Nghệ sĩ yêu thích</label>
                        <input type="text" name="favoriteArtists" class="form-control"
                               th:value="${currentUser?.favoriteArtists}"
                               placeholder="VD: Alan Walker, Sơn Tùng M-TP, Taylor Swift">
                        <small class="form-text text-muted">Cách nhau bằng dấu phẩy</small>
                    </div>

                    <div class="button-center">
                        <button type="submit" class="btn-primary-large">
                            <i class="fa fa-save"></i> Cập nhật sở thích
                        </button>
                    </div>
                </form>
            </div>

            <!-- Nút Đăng xuất -->
            <div class="button-center mt-5">
                <a th:href="@{/logout}" class="btn-logout-large">
                    <i class="fa fa-sign-out-alt"></i> Đăng xuất
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Hiệu ứng sóng -->
<div class="wave"></div>

</body>
</html>
